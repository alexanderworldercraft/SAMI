<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>Import vidéo</title></head>
<body><main><h1 id="title">Import vidéo</h1><p id="status"></p>
<section id="page"><strong id="page-title"></strong><small id="page-url"></small></section>
<section><label for="media">Média détecté</label><select id="media"></select><small id="companion-state"></small></section>
<section class="form"><label for="video-title">Titre</label><input id="video-title" maxlength="100"><label for="description">Description</label><textarea id="description" rows="3"></textarea>
<div class="field-row"><div><label for="series">Série (optionnelle)</label><input id="series-search" type="search" placeholder="Rechercher une série…"><select id="series"><option value="">Aucune série</option></select></div><div><label for="season">Saison</label><select id="season" disabled><option value="">Aucune saison</option></select></div></div>
<div><label for="genre-search">Genres</label><input id="genre-search" type="search" placeholder="Filtrer les genres…"><div id="genres" class="check-list" aria-label="Genres disponibles"></div></div>
<fieldset><legend>Image (optionnelle)</legend><div class="choice-row"><label><input type="radio" name="image-mode" value="page" checked> Image de la page</label><label><input type="radio" name="image-mode" value="file"> Fichier personnel</label><label><input type="radio" name="image-mode" value="none"> Aucune</label></div><input id="image-file" type="file" accept="image/*" hidden><div id="image-preview-wrap" class="image-preview"><img id="image-preview" alt="Aperçu de l’affiche"><small id="image-hint"></small></div></fieldset>
<div><label for="encoding-mode">Mode d’encodage</label><select id="encoding-mode"><option value="classic">Simple — serveur principal</option><option value="distributed" disabled>Multi-serveur — indisponible</option></select><small id="encoding-hint"></small></div>
</section>
<div class="actions"><button id="download">Télécharger en local</button><button id="import">Importer dans __APP_NAME__</button></div>
<section id="auth"><button id="login">Se connecter à __APP_NAME__</button><button id="logout" hidden>Déconnecter l’extension</button></section>
<p class="note">L’extension détecte les requêtes du lecteur. Le compagnon local assemble les flux HLS/DASH avec FFmpeg, sans yt-dlp.</p>
</main><script type="module" src="popup.js"></script></body></html>
